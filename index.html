<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CV & Portfolio App</title>

    <!-- Tailwind CSS (Grafica) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome (Icone Mobile) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Meta Tags PWA (Aggiungi a Home su Smartphone) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1877F2">
    <link rel="manifest" href="manifest.json">

    <!-- Stili e Ottimizzazioni Mobile Native -->
    <style>
        body {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }
        input, textarea {
            -webkit-user-select: text;
            user-select: text;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans pb-24">

    <!-- Header Fisso in Alto -->
    <header class="bg-[#1877F2] text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
        <h1 class="text-base font-bold tracking-wide"><i class="fa-solid fa-bolt mr-2"></i>Mio Portfolio</h1>
    </header>

    <!-- CONTENITORE SEZIONI (One Page) -->
    <main class="p-4 max-w-md mx-auto">

        <!-- 1. SEZIONE HOME -->
        <section id="section-home" class="space-y-4">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-700 h-28 w-full rounded-2xl relative"></div>
            <div class="bg-white rounded-3xl p-6 shadow-sm text-center -mt-16 relative z-10 border border-gray-100">
                <div class="w-20 h-20 bg-blue-600 text-white rounded-full mx-auto flex items-center justify-center font-bold text-2xl border-4 border-white shadow">
                    <!--  <i class="fa-solid fa-user-tie"></i> -->
                    <img src="https://github.com/altomare97/altomare-mobile-app/blob/main/AA%20-%20Logo%20Sfondo%20Arancione.png?raw=true alt="logo" class="w-20 h-20 rounded-full mx-auto object-cover border-4 border-white shadow">
                </div>
                <h2 id="profile-name" class="text-xl font-bold mt-3 text-gray-800">Caricamento...</h2>
                <p id="profile-role" class="text-blue-600 font-semibold text-xs">...</p>
                <p id="profile-city" class="text-xs text-gray-400 mt-1"></p>

                <!-- Azioni Rapide -->
                <div class="grid grid-cols-4 gap-2 mt-5">
                    <a id="btn-call" href="#" class="flex flex-col items-center p-2 rounded-xl bg-gray-50 text-blue-600 hover:bg-blue-50">
                        <i class="fa-solid fa-phone text-base"></i>
                        <span class="text-[9px] mt-1 font-medium">Chiama</span>
                    </a>
                    <a id="btn-email" href="#" class="flex flex-col items-center p-2 rounded-xl bg-gray-50 text-blue-600 hover:bg-blue-50">
                        <i class="fa-solid fa-envelope text-base"></i>
                        <span class="text-[9px] mt-1 font-medium">Email</span>
                    </a>
                    <a id="btn-whatsapp" href="#" target="_blank" class="flex flex-col items-center p-2 rounded-xl bg-gray-50 text-green-600 hover:bg-green-50">
                        <i class="fa-brands fa-whatsapp text-base"></i>
                        <span class="text-[9px] mt-1 font-medium">WhatsApp</span>
                    </a>
                    <a id="btn-linkedin" href="#" target="_blank" class="flex flex-col items-center p-2 rounded-xl bg-gray-50 text-blue-700 hover:bg-blue-50">
                        <i class="fa-brands fa-linkedin-in text-base"></i>
                        <span class="text-[9px] mt-1 font-medium">LinkedIn</span>
                    </a>
                </div>
            </div>

            <!-- Bio Card -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                <h3 class="text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Chi Sono</h3>
                <p id="profile-bio" class="text-xs text-gray-600 leading-relaxed"></p>
            </div>
        </section>

        <!-- 2. SEZIONE SKILL -->
        <section id="section-skills" class="space-y-4 hidden">
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                <h2 class="text-base font-bold text-gray-800 mb-3 flex items-center">
                    <i class="fa-solid fa-code mr-2 text-blue-600"></i>Competenze Tecniche
                </h2>
                <div id="skills-list" class="flex flex-wrap gap-2">
                    <!-- Popolato dinamicamente da JS -->
                </div>
            </div>
        </section>

        <!-- 3. SEZIONE ATTESTATI -->
        <section id="section-attestati" class="space-y-4 hidden">
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                <h2 class="text-base font-bold text-gray-800 mb-3 flex items-center">
                    <i class="fa-solid fa-certificate mr-2 text-blue-600"></i>Attestati e Certificazioni
                </h2>
                <div id="attestati-list" class="space-y-3">
                    <!-- Popolato dinamicamente da JS -->
                </div>
            </div>
        </section>

        <!-- 4. SEZIONE BLOG -->
        <section id="section-blog" class="space-y-4 hidden">
            <!-- Ultimo Articolo Pubblicato -->
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                <span class="text-[10px] bg-blue-100 text-blue-700 font-bold px-2 py-0.5 rounded-full">Ultimo Articolo</span>
                <h2 id="latest-blog-title" class="text-sm font-bold text-gray-800 mt-2">Caricamento...</h2>
                <p id="latest-blog-date" class="text-[10px] text-gray-400 mb-2"></p>
                <p id="latest-blog-text" class="text-xs text-gray-600 leading-relaxed"></p>
            </div>

            <!-- Storico Articoli (Albero) -->
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                <h3 class="text-xs font-bold text-gray-700 uppercase tracking-wider mb-3">Storico Articoli</h3>
                <div id="blog-history" class="space-y-4 ml-1">
                    <!-- Popolato dinamicamente da JS -->
                </div>
            </div>
        </section>

    </main>

    <!-- BARRA DI NAVIGAZIONE IN BASSO -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2 px-4 flex justify-around items-center z-50 shadow-lg">
        <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-blue-600 transition">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Home</span>
        </button>
        <button onclick="switchTab('skills')" id="nav-skills" class="flex flex-col items-center text-gray-400 hover:text-gray-600 transition">
            <i class="fa-solid fa-code text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Skill</span>
        </button>
        <button onclick="switchTab('attestati')" id="nav-attestati" class="flex flex-col items-center text-gray-400 hover:text-gray-600 transition">
            <i class="fa-solid fa-certificate text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Attestati</span>
        </button>
        <button onclick="switchTab('blog')" id="nav-blog" class="flex flex-col items-center text-gray-400 hover:text-gray-600 transition">
            <i class="fa-solid fa-newspaper text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Blog</span>
        </button>
    </nav>

    <!-- DATI DEL CV E LOGICA JAVASCRIPT INTEGRATA -->
    <script>
        // --- INSERISCI QUI I TUOI DATI E I TUOI ARTICOLI ---
        const portfolioData = {
            nome: "Il Tuo Nome",
            ruolo: "Sviluppatore Web & Tech Specialist",
            citta: "Molfetta, Italia",
            bio: "Professionista appassionato di tecnologia, sviluppo web e innovazione digitale. Creo soluzioni moderne e veloci fruibili da qualsiasi dispositivo.",
            
            // Contatti
            telefono: "+393000000000",
            email: "tuamail@example.com",
            whatsapp: "393000000000",
            linkedin: "https://linkedin.com",

            // Skill
            skills: [
                { nome: "HTML5 & CSS3", livello: "Avanzato" },
                { nome: "JavaScript / PWA", livello: "Intermedio" },
                { nome: "GitHub & Render", livello: "Avanzato" },
                { nome: "UI/UX Mobile Design", livello: "Intermedio" }
            ],

            // Attestati / Certificazioni
            attestati: [
                { titolo: "Certificazione Web Developer", ente: "Accademia Tech", anno: "2024" },
                { titolo: "Corso Avanzato di Mobile PWA", ente: "Google Developer", anno: "2023" }
            ],

            // Articoli del Blog (Il primo nell'elenco apparirà in evidenza, gli altri nello storico ad albero)
            articoli: [
                {
                    id: 1,
                    titolo: "Come trasformare una pagina web in un'app per telefono gratis",
                    data: "11 Ottobre 2026",
                    testo: "Oggi scopriremo quanto sia semplice sfruttare GitHub e Render per pubblicare una Progressive Web App installabile direttamente sulla home del telefono senza spendere un euro."
                },
                {
                    id: 2,
                    titolo: "I vantaggi di una One-Page Mobile First",
                    data: "01 Settembre 2026",
                    testo: "Un design pulito, sezioni immediate e zero tempi di caricamento rendono l'esperienza utente impeccabile su smartphone."
                }
            ]
        };

        // RENDER DINAMICO
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("profile-name").innerText = portfolioData.nome;
            document.getElementById("profile-role").innerText = portfolioData.ruolo;
            document.getElementById("profile-city").innerHTML = `<i class="fa-solid fa-location-dot mr-1"></i>${portfolioData.citta}`;
            document.getElementById("profile-bio").innerText = portfolioData.bio;

            document.getElementById("btn-call").href = `tel:${portfolioData.telefono}`;
            document.getElementById("btn-email").href = `mailto:${portfolioData.email}`;
            document.getElementById("btn-whatsapp").href = `https://wa.me/${portfolioData.whatsapp}`;
            document.getElementById("btn-linkedin").href = portfolioData.linkedin;

            // Skills
            const skillsContainer = document.getElementById("skills-list");
            portfolioData.skills.forEach(s => {
                skillsContainer.innerHTML += `<span class="px-3 py-1 bg-gray-100 text-gray-700 text-xs font-medium rounded-xl">${s.nome} (${s.livello})</span>`;
            });

            // Attestati
            const attestatiContainer = document.getElementById("attestati-list");
            portfolioData.attestati.forEach(a => {
                attestatiContainer.innerHTML += `
                    <div class="p-3 bg-gray-50 rounded-xl border border-gray-100">
                        <span class="text-[10px] text-blue-600 font-bold">${a.anno} - ${a.ente}</span>
                        <h3 class="text-xs font-bold text-gray-800 mt-0.5">${a.titolo}</h3>
                    </div>`;
            });

            // Blog
            if(portfolioData.articoli.length > 0) {
                const ultimo = portfolioData.articoli[0];
                document.getElementById("latest-blog-title").innerText = ultimo.titolo;
                document.getElementById("latest-blog-date").innerText = ultimo.data;
                document.getElementById("latest-blog-text").innerText = ultimo.testo;

                const historyContainer = document.getElementById("blog-history");
                for(let i = 1; i < portfolioData.articoli.length; i++) {
                    let art = portfolioData.articoli[i];
                    historyContainer.innerHTML += `
                        <div class="border-l-2 border-gray-200 pl-3 py-1">
                            <span class="text-[10px] text-gray-400">${art.data}</span>
                            <h4 class="text-xs font-bold text-gray-700">${art.titolo}</h4>
                            <p class="text-[11px] text-gray-500 mt-0.5">${art.testo}</p>
                        </div>`;
                }
            }
        });

        // CAMBIO SCHEDA (Tab switching)
        function switchTab(tabId) {
            const tabs = ['home', 'skills', 'attestati', 'blog'];
            tabs.forEach(t => {
                document.getElementById(`section-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).classList.remove('text-blue-600');
                document.getElementById(`nav-${t}`).classList.add('text-gray-400');
            });

            document.getElementById(`section-${tabId}`).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).classList.remove('text-gray-400');
            document.getElementById(`nav-${tabId}`).classList.add('text-blue-600');
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
